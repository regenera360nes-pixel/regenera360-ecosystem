# Master Configuration for Regenera360 Ecosystem
# Apache-2.0 License
# MCP Architect - Simulated Architecture Configuration

version: "1.0.0"
license: "Apache-2.0"
architect: "MCP Architect"
priority_plan: "PLAN_11_MIN_TIME"

# Architecture Components
architecture:
  ecosystem_name: "Regenera360 Ecosystem"
  deployment_mode: "simulated"
  
  # Core Services
  services:
    api_gateway:
      enabled: true
      port: 8080
      protocol: "https"
      mock_mode: true
      
    database:
      enabled: true
      type: "postgresql"
      port: 5432
      mock_mode: true
      mock_data: "sample_dataset"
      
    cache:
      enabled: true
      type: "redis"
      port: 6379
      mock_mode: true
      
    message_queue:
      enabled: true
      type: "rabbitmq"
      port: 5672
      mock_mode: true
      
    ai_service:
      enabled: true
      model: "gpt-4"
      mock_mode: true
      mock_responses: true
      
    analytics:
      enabled: true
      provider: "custom"
      mock_mode: true

# Credentials Configuration
credentials:
  detection_mode: "auto"
  fallback_to_mocks: true
  
  mocks:
    database:
      username: "mock_user"
      password: "mock_pass_${RANDOM_SALT}"
      host: "localhost"
      
    api_keys:
      openai: "sk-mock-${RANDOM_SALT}"
      stripe: "sk_test_mock_${RANDOM_SALT}"
      aws: "AKIA_MOCK_${RANDOM_SALT}"
      
    oauth:
      google_client_id: "mock_client_${RANDOM_SALT}.apps.googleusercontent.com"
      google_client_secret: "mock_secret_${RANDOM_SALT}"

# Environment Variables Mock Substitution
environment:
  mock_enabled: true
  variables:
    NODE_ENV: "development"
    DATABASE_URL: "postgresql://mock_user:mock_pass@localhost:5432/regenera360_mock"
    REDIS_URL: "redis://localhost:6379/0"
    API_BASE_URL: "http://localhost:8080"
    JWT_SECRET: "mock_jwt_secret_${RANDOM_SALT}"
    ENCRYPTION_KEY: "mock_encryption_${RANDOM_SALT}"
    LOG_LEVEL: "debug"
    MAX_WORKERS: "4"
    CACHE_TTL: "3600"

# 11 Plans Configuration
plans:
  PLAN_01_CORE_INFRASTRUCTURE:
    status: "ready"
    priority: 1
    components:
      - "Base directory structure"
      - "Configuration management"
      - "Logging system"
    estimated_time: "2h"
    
  PLAN_02_SECURITY:
    status: "ready"
    priority: 2
    components:
      - "Authentication system"
      - "Authorization middleware"
      - "Encryption at rest"
      - "TLS/SSL configuration"
    estimated_time: "4h"
    
  PLAN_03_BUILD_SYSTEM:
    status: "ready"
    priority: 3
    components:
      - "Build scripts"
      - "Dependency management"
      - "Asset compilation"
    estimated_time: "3h"
    
  PLAN_04_TESTING:
    status: "ready"
    priority: 4
    components:
      - "Unit tests"
      - "Integration tests"
      - "E2E tests"
      - "Performance tests"
    estimated_time: "5h"
    
  PLAN_05_DOCUMENTATION:
    status: "ready"
    priority: 5
    components:
      - "API documentation"
      - "Architecture diagrams"
      - "User guides"
      - "Developer docs"
    estimated_time: "3h"
    
  PLAN_06_CI_CD:
    status: "ready"
    priority: 6
    components:
      - "GitHub Actions workflows"
      - "Automated testing"
      - "Deployment pipelines"
      - "Release management"
    estimated_time: "4h"
    
  PLAN_07_MONITORING:
    status: "ready"
    priority: 7
    components:
      - "Application metrics"
      - "Error tracking"
      - "Performance monitoring"
      - "Alerting system"
    estimated_time: "4h"
    
  PLAN_08_API_GATEWAY:
    status: "ready"
    priority: 8
    components:
      - "Rate limiting"
      - "Request validation"
      - "Response caching"
      - "API versioning"
    estimated_time: "3h"
    
  PLAN_09_DATA_MANAGEMENT:
    status: "ready"
    priority: 9
    components:
      - "Data models"
      - "Migrations"
      - "Backup strategy"
      - "Data validation"
    estimated_time: "4h"
    
  PLAN_10_DEPLOYMENT:
    status: "ready"
    priority: 10
    components:
      - "Container orchestration"
      - "Load balancing"
      - "Auto-scaling"
      - "Rollback procedures"
    estimated_time: "5h"
    
  PLAN_11_MIN_TIME:
    status: "active"
    priority: 0  # Highest priority
    components:
      - "Optimized build process"
      - "Parallel execution"
      - "Cached dependencies"
      - "Fast deployment strategy"
      - "Incremental builds"
      - "Hot reload enabled"
    estimated_time: "1h"
    optimizations:
      - "Skip unnecessary steps"
      - "Use pre-built containers"
      - "Parallel task execution"
      - "Aggressive caching"
      - "Lazy loading"

# Build and Orchestration
build:
  strategy: "parallel"
  cache_enabled: true
  optimizations:
    - "dependency_caching"
    - "layer_caching"
    - "parallel_builds"
    - "incremental_compilation"
  
orchestration:
  tool: "docker-compose"
  mode: "simulated"
  services_startup_order:
    - "database"
    - "cache"
    - "message_queue"
    - "api_gateway"
    - "ai_service"
    - "analytics"

# Health Checks
health_checks:
  enabled: true
  interval: "30s"
  timeout: "5s"
  retries: 3
  endpoints:
    - path: "/health"
      expected_status: 200
    - path: "/ready"
      expected_status: 200

# Feature Flags
features:
  auto_scaling: true
  blue_green_deployment: true
  canary_releases: true
  circuit_breaker: true
  distributed_tracing: true
  feature_toggles: true
